---
name: Daily Spark
description: Clock and daily quotes for TRMNL
strategy: polling
polling_url: https://zenquotes.io/api/today
polling_verb: GET
polling_headers: ''
refresh_interval: 15
framework_version: latest
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: about
    name: About Daily Spark
    field_type: author_bio
    category: life,productivity
    description: Daily clock and quote dashboard with original and ZenQuotes content.
    github_url: https://github.com/itscryptune/dailyspark
